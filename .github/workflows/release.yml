name: release
# Push a tag like v1.0.0 to publish PathForge.rbxmx as a GitHub release.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install lupa==2.8
      - run: python tests/run.py
      - run: python tools/build_rbxmx.py --check
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="RELEASE_NOTES.md"
          gh release create "$GITHUB_REF_NAME" PathForge.rbxmx --title "PathForge $GITHUB_REF_NAME" --notes-file "$notes"
